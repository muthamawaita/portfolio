version: '3.9'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: portfolio_studio
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: portfolio
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  api:
    build:
      context: .
      dockerfile: api.Dockerfile
    environment:
      DATABASE_URL: mysql://portfolio:portfolio@mysql:3306/portfolio_studio
      REDIS_URL: redis://redis:6379
    depends_on:
      - mysql
      - redis
    ports:
      - '3001:3001'

  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    environment:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - '3000:3000'

volumes:
  mysql-data:
